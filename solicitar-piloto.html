<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Piloto | SEDU - Sentinel Edu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #1A4D4C;
            --primary: #2A7E7D;
            --primary-light: #52B5B4;
            --accent: #FF7F50;
            --accent-hover: #E0693F;
            --bg-light: #F0F7F7;
            --white: #FFFFFF;
            --text-dark: #2C3E50;
            --text-gray: #596A7A;
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.08);
            --transition: all 0.3s ease;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .site-header {
            background-color: var(--white);
            padding: 0.8rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 48px;
            width: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            flex-direction: column;
            line-height: 1.1;
            font-family: 'Montserrat', sans-serif;
        }
        
        .logo-text span {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-gray);
            letter-spacing: 1px;
        }

        .btn-volver {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .btn-volver:hover {
            color: var(--accent);
        }

        /* CONTENEDOR DEL FORMULARIO */
        .form-container {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .form-card {
            background: var(--white);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: var(--shadow-md);
            border-top: 6px solid var(--accent);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-family: 'Montserrat', sans-serif;
            color: var(--primary-dark);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        /* CAMPOS DEL FORMULARIO */
        .pilot-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--primary-dark);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .pilot-form input,
        .pilot-form select,
        .pilot-form textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-dark);
            background-color: #FAFAFA;
            transition: var(--transition);
        }

        .pilot-form input:focus,
        .pilot-form select:focus,
        .pilot-form textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--white);
            box-shadow: 0 0 0 3px rgba(42, 126, 125, 0.15);
        }

        .btn-submit {
            background-color: var(--accent);
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* FOOTER */
        .site-footer {
            background-color: #113332;
            color: var(--white);
            text-align: center;
            padding: 25px 5%;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="./" class="logo-container">
            <img src="logo.png" alt="Logotipo oficial de SEDU" class="logo-img" width="48" height="48">
            <div class="logo-text">
                SEDU <span>SENTINEL EDU</span>
            </div>
        </a>
        <a href="./" class="btn-volver">&larr; Volver al inicio</a>
    </header>

    <main class="form-container">
        <div class="form-card">
            <div class="form-header">
                <h1>Solicitar Piloto de Demostración</h1>
                <p>Ingresa los datos de tu establecimiento para coordinar la implementación del sistema SEDU.</p>
            </div>

            <form class="pilot-form" onsubmit="event.preventDefault(); alert('¡Muchas gracias! Tu solicitud ha sido recibida correctamente. Nos contactaremos a la brevedad.'); window.location.href='./';">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo *</label>
                        <input type="text" id="nombre" placeholder="Ej: Maria González" required>
                    </div>
                    <div class="form-group">
                        <label for="cargo">Cargo o Rol *</label>
                        <select id="cargo" required>
                            <option value="" disabled selected>Selecciona una opción</option>
                            <option value="Director">Director(a) / Sostenedor(a)</option>
                            <option value="Encargado Convivencia">Encargado(a) de Convivencia</option>
                            <option value="Coordinador TI">Coordinador(a) IT / Tecnología</option>
                            <option value="Docente">Docente / Inspector General</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Correo Institucional *</label>
                        <input type="email" id="email" placeholder="ejemplo@colegio.cl" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono de Contacto *</label>
                        <input type="tel" id="telefono" placeholder="+56 9 1234 5678" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="colegio">Nombre del Establecimiento Educacional *</label>
                    <input type="text" id="colegio" placeholder="Ej: Liceo Bicentenario..." required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="comuna">Comuna / Región *</label>
                        <input type="text" id="comuna" placeholder="Ej: Santiago, Región Metropolitana" required>
                    </div>
                    <div class="form-group">
                        <label for="matricula">Matrícula Estimada (Estudiantes)</label>
                        <select id="matricula">
                            <option value="" disabled selected>Selecciona un rango</option>
                            <option value="1-300">Menos de 300 estudiantes</option>
                            <option value="301-800">300 a 800 estudiantes</option>
                            <option value="801-1500">800 a 1.500 estudiantes</option>
                            <option value="1500+">Más de 1.500 estudiantes</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mensaje">Detalles Adicionales o Consultas</label>
                    <textarea id="mensaje" rows="4" placeholder="Indícanos si cuentan con sistema de cámaras actual o requerimientos específicos..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Enviar Solicitud de Piloto</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Sentinel Edu (SEDU). Todos los derechos reservados.</p>
    </footer>

</body>
</html>
